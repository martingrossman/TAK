/* Milestone Diamond styling and Project Milestones lane */
.gantt-milestone {
  position: absolute;
  top: 13px;
  display: inline-flex;
  align-items: center;
  z-index: 3;
  pointer-events: auto;
  user-select: none;
}
.gantt-milestone-diamond {
  width: 18px;
  height: 18px;
  border-radius: 3px;
  background: var(--milestone-color, #d97706);
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(15, 23, 42, 0.25);
  transform: rotate(45deg);
  cursor: grab;
  touch-action: none;
  flex: none;
  margin-left: -9px;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.gantt-milestone-diamond:hover, .gantt-milestone-diamond:focus-visible {
  transform: rotate(45deg) scale(1.15);
  box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.25), 0 2px 6px rgba(15, 23, 42, 0.3);
  outline: none;
}
.gantt-milestone-diamond:active {
  cursor: grabbing;
}
.gantt-milestone.is-done .gantt-milestone-diamond {
  background: #00875a;
  border-color: #fff;
}
.gantt-milestone.is-overdue .gantt-milestone-diamond {
  background: #dc2626;
  border-color: #fff;
}
.gantt-milestone-label {
  margin-left: 8px;
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid var(--line, #e2e8f0);

  color: var(--ink, #0f172a);
  white-space: nowrap;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
  transition: background 0.12s, border-color 0.12s;
}
.gantt-milestone-label small {
  font-weight: 400;
  color: var(--muted, #64748b);
  margin-left: 4px;
}
.gantt-milestone-label:hover {
  background: #fff;
  border-color: var(--primary, #2563eb);
}
.gantt-header-milestone-pin {
  position: absolute;
  top: 14px;
  width: 14px;
  height: 14px;
  border-radius: 2px;
  background: #d97706;
  border: 1.5px solid #fff;
  transform: translateX(-7px) rotate(45deg);
  cursor: pointer;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.2);
  transition: transform 0.12s ease;
}
.gantt-header-milestone-pin:hover {
  transform: translateX(-7px) rotate(45deg) scale(1.25);
}
.gantt-header-milestone-pin.is-done {
  background: #00875a;
}

.swimlane-header:hover .swimlane-order-controls,
.swimlane-header:focus-within .swimlane-order-controls {
  opacity: 1;
}
.swimlane-move-btn,
.swimlane-drag-grip {
