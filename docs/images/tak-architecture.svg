<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-labelledby="title desc">
  <title id="title">Your private, serverless TAK tracker</title>
  <desc id="desc">Your browser connects to your own TAK app on Google Apps Script, which reads and saves data in your own Google Sheet. Google hosts both services. For private use, deploy the app as Only myself and keep the Sheet unshared.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .title { font-size: 16px; font-weight: 600; }
    .line { font-size: 14px; }
    .edge { font-size: 13px; fill: #475569; }
    .group { font-size: 13px; fill: #475569; text-anchor: start; }
  </style>

  <!-- Card background keeps the diagram legible in both light and dark GitHub themes -->
  <rect x="0.5" y="0.5" width="719" height="199" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Google-hosted group -->
  <rect x="214" y="16" width="490" height="168" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text class="group" x="230" y="40">Your copy · hosted by Google</text>

  <!-- Browser -->
  <rect x="16" y="78" width="140" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="title" x="86" y="111" fill="#0f172a">Your browser</text>

  <!-- App -->
  <rect x="232" y="56" width="190" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text class="title" x="327" y="86" fill="#1e3a8a">Your TAK app</text>
  <text class="line" x="327" y="110" fill="#1e3a8a">Google Apps Script</text>
  <text class="line" x="327" y="132" fill="#1e3a8a">Access: Only myself</text>

  <!-- Sheet -->
  <rect x="506" y="56" width="184" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text class="title" x="598" y="86" fill="#064e3b">Your project data</text>
  <text class="line" x="598" y="110" fill="#064e3b">Google Sheets</text>
  <text class="line" x="598" y="132" fill="#064e3b">Kept unshared</text>

  <!-- Connections -->
  <line x1="159" y1="106" x2="229" y2="106" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="edge" x="185" y="96">Use TAK</text>
  <line x1="425" y1="106" x2="503" y2="106" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="edge" x="464" y="96">Read / save</text>
</svg>
